# ANCHOR: all
# Training: a service that copies the SQLite shelf once a day into the
# same volume, under a name with the date. Use it next to compose.yaml:
#   docker compose -f compose.yaml -f answers/compose/compose.backup.yaml up -d
# トレーニング：SQLite の本棚を、1日に1回、日付の入った名前で、同じ
# ボリュームに写すサービス。compose.yaml と一緒に使う
services:
  backup:
    image: ${TSUNDOKU_IMAGE:-tsundoku:0.1}
    profiles: [sqlite]
    restart: unless-stopped
    volumes:
      - shelf-data:/data
    environment:
      TSUNDOKU_DB: sqlite:/data/tsundoku.db
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f="/data/backup-$$(date +%F).db"
          [ -e "$$f" ] || shelf backup "$$f"
          sleep 86400
        done
# ANCHOR_END: all
