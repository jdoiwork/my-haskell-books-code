# ANCHOR: all
# The shelf for people who do not build it: `docker compose up -d`.
# Choose SQLite or PostgreSQL with COMPOSE_PROFILES in .env.
# 本棚を、ビルドしない人のために：docker compose up -d。
# SQLite か PostgreSQL かは、.env の COMPOSE_PROFILES で選ぶ

# The project's name: containers and volumes are tsundoku-…, wherever
# this folder is.
# プロジェクトの名前。コンテナとボリュームは、このフォルダーがどこにあっても
# tsundoku-… になる
name: tsundoku

# ANCHOR: common
# What every shelf container shares. Only this machine may come in
# (127.0.0.1); inside the container, the shelf waits on every address.
# どの本棚のコンテナにも共通のもの。入ってこられるのは、このマシンだけ
# （127.0.0.1）。コンテナの中では、本棚はどの住所でも待つ
x-shelf: &shelf
  image: ${TSUNDOKU_IMAGE:-tsundoku:0.1}
  restart: unless-stopped
  ports:
    - "127.0.0.1:${TSUNDOKU_PORT:-8080}:8080"
  networks:
    default:
      aliases: [shelf]
# ANCHOR_END: common

services:
  # ANCHOR: sqlite
  # SQLite: one container, and one volume for the file.
  # SQLite：コンテナ1つと、ファイルのためのボリューム1つ
  shelf-sqlite:
    <<: *shelf
    profiles: [sqlite]
    environment:
      TSUNDOKU_DB: sqlite:/data/tsundoku.db
      TSUNDOKU_RATING: ${TSUNDOKU_RATING:-stars}
    volumes:
      - shelf-data:/data
  # ANCHOR_END: sqlite

  # ANCHOR: postgres
  # PostgreSQL with PGroonga (Japanese full-text search). The password is
  # a secret: a file, never written in this one.
  # PostgreSQL と PGroonga（日本語の全文検索）。パスワードは secret：
  # ファイルに置き、このファイルには決して書かない
  shelf-postgres:
    <<: *shelf
    profiles: [postgres]
    environment:
      TSUNDOKU_DB: "postgres:host=db user=shelf dbname=tsundoku"
      TSUNDOKU_DB_PASSWORD_FILE: /run/secrets/db_password
      TSUNDOKU_RATING: ${TSUNDOKU_RATING:-stars}
    secrets: [db_password]
    volumes:
      - shelf-files:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: groonga/pgroonga:4.1.0-debian-18
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: shelf
      POSTGRES_DB: tsundoku
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pg-data:/var/lib/postgresql
    # Ready when it answers pg_isready.
    # pg_isready に答えたら、準備ができた
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shelf", "-d", "tsundoku"]
      interval: 2s
      retries: 30
  # ANCHOR_END: postgres

  # ANCHOR: tui
  # The terminal screen: docker compose run --rm tui
  # ターミナルの画面：docker compose run --rm tui
  tui:
    image: ${TSUNDOKU_IMAGE:-tsundoku:0.1}
    profiles: [tui]
    command: ["shelf-tui"]
    environment:
      TSUNDOKU_API: http://shelf:8080/api
    stdin_open: true
    tty: true
  # ANCHOR_END: tui

# ANCHOR: volumes
volumes:
  shelf-data:
  shelf-files:
  pg-data:

secrets:
  db_password:
    file: ./db_password.txt
# ANCHOR_END: volumes
# ANCHOR_END: all
