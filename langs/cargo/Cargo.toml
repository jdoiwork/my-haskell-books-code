# Rust comparison code that needs crates (serde, clap, proptest, rusqlite, diesel).
# クレートを使う Rust の比較のコード（serde、clap、proptest、rusqlite、diesel）
[package]
name = "book-langs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
diesel = { version = "2.3.14", features = ["sqlite"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1.12.0"
