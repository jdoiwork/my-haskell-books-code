# Rust comparison code that needs crates (serde, clap, proptest, rusqlite, diesel, jiff, regex, regex-automata, log, nom).
# クレートを使う Rust の比較のコード（serde、clap、proptest、rusqlite、diesel、jiff、regex、regex-automata、log、nom）
[package]
name = "book-langs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
diesel = { version = "2.3.14", features = ["sqlite"] }
jiff = "0.2.43"
# regex-automata tells which strategy it chose (the chapter on learning
# from other lands)
# regex-automata が、どの手を選んだかを教える（よその国に学ぶ章）
log = "0.4.35"
nom = "8.0.0"
regex = "1.13.1"
regex-automata = { version = "0.4.18", features = ["logging"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1.12.0"
